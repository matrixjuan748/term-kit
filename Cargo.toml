[package]
name = "term-kit"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/matrixjuan748/term-kit"
authors = ["Weiming Huang <weiminghuang348@gmail.com>"]
description = "A simple history finder using Rust"

[package.metadata.wix]
upgrade-guid = "8EC346EB-FAEE-4F27-B49E-44469818A6D1"
path-guid = "CD6B69FE-9CC6-4346-AAAC-396DF0832471"
license = false
eula = false

[dependencies]
anyhow = "1.0.99"
copypasta = "0.10.2"
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = "0.30.2"
serde_json = "1.0.148"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
