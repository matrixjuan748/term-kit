[package]
name = "term-kit"
version = "0.1.105"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/matrixjuan748/term-kit"
authors = ["Weiming Huang <weiminghuang348@gmail.com>"]
description = "A simple history finder using Rust"

[dependencies]
anyhow = "1.0.99"
copypasta = "0.10.2"
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = "0.30.2"
serde_json = "1.0.148"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
